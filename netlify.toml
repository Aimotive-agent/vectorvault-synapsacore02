# Netlify build configuration

[build]
  # Build the root app (the synapsecore/ and aivectorvault/ folders are
  # archived source copies and are not part of the build)
  base = "."

  # This is the command to build the site
  command = "npm run build"

  # This is the directory that contains the built site, relative to the root
  publish = "dist"

# This rule ensures that your single-page application (SPA) works correctly
# with client-side routing. All paths will be served the index.html file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
